
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCREAM.EXE - Daria's Projects</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            background: #008080;
            font-family: "MS Sans Serif", Tahoma, sans-serif;
            color: #111;
        }

        .window {
            max-width: 1050px;
            margin: 0 auto;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #404040 #404040 #ffffff;
            padding: 4px;
            box-shadow: 3px 3px 0 #000;
        }

        .title-bar {
            background: #000080;
            color: white;
            padding: 7px 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-buttons {
            background: #c0c0c0;
            color: black;
            padding: 1px 6px;
            border: 2px solid;
            border-color: white #404040 #404040 white;
        }

        .content {
            padding: 25px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 34px;
            letter-spacing: 2px;
        }

        .intro {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

.artwork {
    background: transparent;
    padding: 0;
    border: none;
}

.artwork img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    object-fit: contain;
}

        .artwork p {
            margin: 8px 3px 4px;
            font-weight: bold;
            text-align: center;
        }

        

        .back {
            display: inline-block;
            margin-top: 22px;
            padding: 7px 14px;
            background: #c0c0c0;
            color: black;
            text-decoration: none;
            border: 2px solid;
            border-color: white #404040 #404040 white;
            font-size: 14px;
        }

        .back:active {
            border-color: #404040 white white #404040;
        }

        @media (max-width: 650px) {
            body {
                padding: 12px 8px;
            }

            .content {
                padding: 14px;
            }

            .comparison {
                grid-template-columns: 1fr;
            }

            .artwork img {
                height: auto;
                max-height: 430px;
            }

            h1 {
                font-size: 27px;
            }
        }
        .schematic {
    display: flex;
    justify-content: center;
    margin-top: 25px;
}

.schematic img {
    display: block;
    width: 100%;
    max-width: 1100px;
    height: auto;
    border: none;
    object-fit: contain;
}
        .repository-link {
    text-align: center;
    margin: 30px 0;
}

.repository-link p {
    margin-bottom: 12px;
}

.win98-button {
    display: inline-block;
    padding: 7px 18px;
    background: #c0c0c0;
    color: black;
    text-decoration: none;
    border: 2px outset white;
    font-family: Tahoma, sans-serif;
    font-size: 13px;
}

.win98-button:active {
    border-style: inset;
}
    </style>
</head>

<body>

<div class="window">

    <div class="title-bar">
        <span>SCREAM.EXE - Project Viewer</span>
        <span class="title-buttons">×</span>
    </div>

    <main class="content">

        <h1>THE SCREAM</h1>

        <div class="intro">
            <strong>An electronic interpretation of Edvard Munch's iconic painting.</strong>
            <br>
            An Arduino-based experiment involving LEDs, electronics,
            and a little bit of existential dread.
        </div>

        <div class="comparison">

            <div class="artwork">
                <img src="scream-board.jpg" alt="Electronic interpretation of The Scream">
            </div>

            <div class="artwork">
                <img src="the-scream.jpg" alt="The Scream by Edvard Munch">
            </div>

        </div>
<div class="schematic">
    <img src="board-schematic.jpg" alt="LED board circuit schematic">
</div>
  <div class="repository-link">
    <p>View the project in the repository</p>
    <a href="https://github.com/H0ngXiang/the-scream-led-artwork"
       target="_blank"
       rel="noopener noreferrer"
       class="win98-button">
        Open GitHub Repository
    </a>
</div>
      

        <a class="back" href="index.html">← Back to homepage</a>

    </main>
</div>

</body>
</html>
